<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Link Analyzer</title>

<style>
*{box-sizing:border-box}

body{
    <section style="margin:20px auto;max-width:1000px;padding:50px 25px;border-radius:24px;background:linear-gradient(135deg,#061b14,#0b3d2e,#19a974);color:#fff;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.3);font-family:Arial,sans-serif;">
  <div style="font-size:50px;margin-bottom:15px;">🛡️</div>

  <h1 style="margin:0;font-size:42px;font-weight:800;">
    Link Checker
  </h1>

  <p style="margin:15px 0 0;font-size:20px;opacity:.95;">
    افحص الروابط واكتشف الروابط المشبوهة
  </p>

  <div style="margin:25px auto 0;width:80px;height:4px;background:#19a974;border-radius:10px;"></div>
</section>
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b1220;
    color:white;
}

.container{
    max-width:700px;
    margin:50px auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#38bdf8;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

.box{
    background:#111c2e;
    padding:25px;
    border-radius:18px;
    border:1px solid #26364f;
}

input{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #475569;
    background:#0f172a;
    color:white;
    font-size:16px;
    direction:ltr;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#0284c7;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.result{
    margin-top:20px;
    padding:20px;
    border-radius:12px;
    display:none;
}

.safe{background:#064e3b}
.warning{background:#713f12}
.danger{background:#7f1d1d}

ul{
    line-height:2;
}

.note{
    margin-top:20px;
    color:#94a3b8;
    font-size:13px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>🛡️ Cyber Link Analyzer</h1>

<div class="subtitle">
تحليل الروابط واكتشاف بعض العلامات المشبوهة
</div>

<div class="box">

<input id="urlInput"
       type="text"
       placeholder="ضع الرابط هنا مثل https://example.com">

<button onclick="analyzeURL()">🔍 تحليل الرابط</button>

<div id="result" class="result"></div>

</div>

<div class="note">
⚠️ هذه الأداة تقدم تحليلًا مبدئيًا ولا تضمن أن الرابط آمن أو خطير.
</div>

</div>

<script>

function analyzeURL(){

    const input = document.getElementById("urlInput");
    const result = document.getElementById("result");

    let value = input.value.trim();

    if(!value){
        result.className = "result warning";
        result.style.display = "block";
        result.innerHTML = "⚠️ أدخل رابطًا أولًا.";
        return;
    }

    // إضافة https إذا لم يكتب المستخدم البروتوكول
    let testURL = value;

    if(!/^https?:\/\//i.test(testURL)){
        testURL = "https://" + testURL;
    }

    let url;

    try{
        url = new URL(testURL);
    }catch(e){
        result.className = "result danger";
        result.style.display = "block";
        result.innerHTML = "❌ الرابط غير صالح.";
        return;
    }

    let score = 0;
    let warnings = [];

    // HTTP
    if(url.protocol !== "https:"){
        score += 2;
        warnings.push("الاتصال يستخدم HTTP وليس HTTPS");
    }

    // IP address
    const ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;

    if(ipPattern.test(url.hostname)){
        score += 2;
        warnings.push("الرابط يستخدم عنوان IP بدل اسم نطاق");
    }

    // كلمات مشبوهة
    const suspiciousWords = [
        "login",
        "signin",
        "verify",
        "verification",
        "account",
        "password",
        "secure",
        "update",
        "confirm"
    ];

    let foundWords = [];

    suspiciousWords.forEach(word => {
        if(value.toLowerCase().includes(word)){
            foundWords.push(word);
        }
    });

    if(foundWords.length > 0){
        score += foundWords.length;
        warnings.push(
            "يحتوي الرابط على كلمات شائعة في صفحات تسجيل الدخول أو التحقق: "
            + foundWords.join(", ")
        );
    }

    // طول الرابط
    if(value.length > 150){
        score += 1;
        warnings.push("الرابط طويل بشكل غير معتاد");
    }

    // @
    if(value.includes("@")){
        score += 2;
        warnings.push("الرابط يحتوي على الرمز @");
    }

    // Punycode
    if(url.hostname.includes("xn--")){
        score += 2;
        warnings.push("اسم النطاق يستخدم Punycode");
    }

    // شرطات كثيرة
    const hyphens = (url.hostname.match(/-/g) || []).length;

    if(hyphens >= 4){
        score += 1;
        warnings.push("اسم النطاق يحتوي على عدد كبير من الشرطات");
    }

    // أجزاء كثيرة في النطاق
    const parts = url.hostname.split(".").filter(Boolean);

    if(parts.length >= 5){
        score += 1;
        warnings.push("اسم النطاق يحتوي على أجزاء كثيرة");
    }

    let title;
    let message;
    let className;

    if(score >= 5){
        title = "🔴 درجة اشتباه مرتفعة";
        message = "تم اكتشاف عدة علامات قد تستحق الحذر.";
        className = "danger";
    }
    else if(score >= 2){
        title = "🟠 درجة اشتباه متوسطة";
        message = "تم اكتشاف بعض العلامات التي تستحق الانتباه.";
        className = "warning";
    }
    else{
        title = "🟢 درجة اشتباه منخفضة";
        message = "لم يتم اكتشاف علامات مريبة كثيرة في الرابط.";
        className = "safe";
    }

    let warningHTML = "";

    if(warnings.length > 0){
        warningHTML = `
        <h3>الأسباب:</h3>
        <ul>
            ${warnings.map(w => `<li>${w}</li>`).join("")}
        </ul>`;
    }else{
        warningHTML = "<p>لم يتم اكتشاف علامات اشتباه واضحة.</p>";
    }

    result.className = "result " + className;
    result.style.display = "block";

    result.innerHTML = `
        <h2>${title}</h2>
        <p>${message}</p>
        <p><b>درجة التحليل: ${score}</b></p>
        ${warningHTML}
    `;
}

</script>

</body>
</html>
