<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاحص الروابط</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#030807;
color:#fff;
}

.container{
max-width:850px;
margin:auto;
padding:18px;
}

.banner{
padding:45px 20px;
text-align:center;
border-radius:25px;
background:linear-gradient(135deg,#063d2b,#087a51,#16c784);
box-shadow:0 15px 45px rgba(0,0,0,.45);
border:1px solid #25d99a;
}

.shield{
font-size:55px;
}

.banner h1{
font-size:42px;
margin:10px 0;
}

.banner p{
color:#d9fff0;
font-size:18px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin:20px 0;
}

.stat{
background:#0b1712;
border:1px solid #214d3c;
border-radius:18px;
padding:20px 10px;
text-align:center;
}

.stat strong{
display:block;
font-size:30px;
color:#38e6a4;
}

.stat span{
color:#849991;
font-size:13px;
}

.card{
background:#0b1712;
border:1px solid #214d3c;
border-radius:22px;
padding:25px;
box-shadow:0 12px 35px rgba(0,0,0,.3);
}

.card h2{
text-align:center;
color:#45e9aa;
}

.sub{
text-align:center;
color:#849991;
margin-bottom:20px;
}

input{
width:100%;
padding:17px;
border-radius:12px;
border:1px solid #365e4d;
background:#030907;
color:#fff;
font-size:16px;
direction:ltr;
outline:none;
}

input:focus{
border-color:#20d991;
}

button{
width:100%;
margin-top:14px;
padding:17px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#18d889,#0cad6e);
color:#03130d;
font-size:17px;
font-weight:bold;
}

.result{
display:none;
margin-top:20px;
padding:20px;
border-radius:15px;
line-height:1.9;
}

.safe{
display:block;
background:#064e3b;
border:1px solid #10b981;
}

.warning{
display:block;
background:#713f12;
border:1px solid #f59e0b;
}

.danger{
display:block;
background:#7f1d1d;
border:1px solid #ef4444;
}

.note{
text-align:center;
color:#71857d;
font-size:13px;
line-height:1.8;
margin:20px 0;
}

@media(max-width:550px){
.stats{
grid-template-columns:1fr;
}

.banner h1{
font-size:34px;
}
}
</style>
</head>

<body>

<div class="container">

<section class="banner">
<div class="shield">🛡️</div>
<h1>LC</h1>
<p>افحص الروابط واكتشف العلامات المشبوهة</p>
</section>

<section class="stats">

<div class="stat">
<strong>🔍</strong>
<span>فحص سريع</span>
</div>

<div class="stat">
<strong>7+</strong>
<span>مؤشرات أمنية</span>
</div>

<div class="stat">
<strong>100%</strong>
<span>مجاني</span>
</div>

</section>

<section class="card">

<h2>🔎 تحليل الرابط</h2>

<div class="sub">
ضع الرابط هنا وسنحلله مبدئيًا
</div>

<input
id="urlInput"
type="text"
placeholder="https://example.com"
>

<button onclick="analyzeURL()">
🔍 فحص الرابط
</button>

<div id="result" class="result"></div>

</section>

<div class="note">
⚠️ الفحص يعتمد على مؤشرات موجودة في الرابط فقط، ولا يضمن أن الموقع آمن أو خطير.
</div>

</div>

<script>

async function analyzeURL(){

const input=document.getElementById("urlInput");
const result=document.getElementById("result");

let value=input.value.trim();

if(!value){
result.className="result warning";
result.style.display="block";
result.innerHTML=
"<h2>⚠️ أدخل رابطًا أولًا</h2>"+
"<p>ضع الرابط في الخانة ثم اضغط فحص الرابط.</p>";
return;
}

let testURL=value;

if(!/^https?:\/\//i.test(testURL)){
testURL="https://"+testURL;
}

try{
new URL(testURL);
}catch(e){
result.className="result danger";
result.style.display="block";
result.innerHTML=
"<h2>❌ الرابط غير صالح</h2>"+
"<p>تأكد من كتابة الرابط بطريقة صحيحة.</p>";
return;
}

result.className="result warning";
result.style.display="block";
result.innerHTML=
"<h2>🔍 جاري التحليل...</h2>"+
"<p>يتم فحص الرابط بواسطة VirusTotal.</p>";

try{

const response=await fetch("https://1c-backend-7viz.onrender.com/scan",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({url:testURL})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error || "فشل إرسال الرابط للفحص");
}

const analysisId=data.data && data.data.id;

if(!analysisId){
throw new Error("لم يتم الحصول على رقم التحليل");
}

let analysis=null;

for(let i=0;i<12;i++){

await new Promise(resolve=>setTimeout(resolve,5000));

const check=await fetch(
 "https://1c-backend-7viz.onrender.com/scan/"+encodeURIComponent(analysisId)
);

const checkData=await check.json();

if(!check.ok){
throw new Error(
checkData.error || "تعذر الحصول على نتيجة التحليل"
);
}

analysis=checkData.data;

if(
analysis &&
analysis.attributes &&
analysis.attributes.status==="completed"
){
break;
}

result.innerHTML=
"<h2>🔄 جاري التحليل...</h2>"+
"<p>VirusTotal ما زال يفحص الرابط.</p>"+
"<p>انتظر قليلًا...</p>";
}

if(
!analysis ||
!analysis.attributes ||
analysis.attributes.status!=="completed"
){
throw new Error("انتهى وقت الانتظار قبل اكتمال التحليل");
}

const stats=analysis.attributes.stats || {};

const malicious=Number(stats.malicious||0);
const suspicious=Number(stats.suspicious||0);
const harmless=Number(stats.harmless||0);
const undetected=Number(stats.undetected||0);

const detections=malicious+suspicious;
const total=malicious+suspicious+harmless+undetected;

let title;
let type;
let message;

if(malicious>0){

type="danger";
title="🔴 الرابط قد يكون خطيرًا";
message="اكتشفت بعض محركات الفحص مؤشرات ضارة في الرابط.";

}else if(suspicious>0){

type="warning";
title="🟠 الرابط مشبوه";
message="اكتشفت محركات الفحص مؤشرات تستحق الحذر.";

}else{

type="safe";
title="🟢 لم يتم اكتشاف تهديد";
message="لم تكتشف محركات الفحص المتاحة مؤشرات ضارة أو مشبوهة.";

}

result.className="result "+type;
result.innerHTML=
"<h2>"+title+"</h2>"+
"<p>"+message+"</p>"+
"<p><b>الاكتشافات: "+detections+" من "+total+"</b></p>"+
"<p>ضار: "+malicious+
" | مشبوه: "+suspicious+
" | سليم: "+harmless+
" | غير مكتشف: "+undetected+"</p>";

}catch(error){

result.className="result danger";
result.innerHTML=
"<h2>❌ حدث خطأ أثناء الفحص</h2>"+
"<p>"+error.message+"</p>";

}

}

</script>

</body>
</html>
