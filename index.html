<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Link Checker</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#123b2d 0,#07120f 35%,#050b09 100%);
    color:white;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:20px;
}

/* البنر */
.banner{
    margin:20px 0 25px;
    padding:45px 22px;
    border-radius:26px;
    text-align:center;
    background:
        linear-gradient(135deg,#061b14,#0b3d2e,#19a974);
    box-shadow:0 18px 45px rgba(0,0,0,.45);
    border:1px solid rgba(25,169,116,.35);
}

.shield{
    font-size:55px;
    margin-bottom:10px;
}

.banner h1{
    margin:0;
    font-size:42px;
    font-weight:800;
}

.banner p{
    margin:15px 0 0;
    font-size:19px;
    color:#d8fff0;
}

.line{
    width:90px;
    height:4px;
    background:#19a974;
    border-radius:20px;
    margin:25px auto 0;
}

/* صندوق الفحص */
.box{
    background:rgba(15,29,25,.94);
    padding:25px;
    border-radius:22px;
    border:1px solid #214638;
    box-shadow:0 12px 35px rgba(0,0,0,.3);
}

.title{
    text-align:center;
    margin-top:0;
    color:#58e6ae;
}

.subtitle{
    text-align:center;
    color:#b7c9c2;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:16px;
    border-radius:12px;
    border:1px solid #39594d;
    background:#07120f;
    color:white;
    font-size:16px;
    direction:ltr;
    outline:none;
}

input:focus{
    border-color:#19a974;
    box-shadow:0 0 0 3px rgba(25,169,116,.15);
}

button{
    width:100%;
    margin-top:15px;
    padding:16px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#19a974,#0f8f62);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:active{
    transform:scale(.98);
}

.result{
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    display:none;
    line-height:1.8;
}

.safe{
    background:#064e3b;
    border:1px solid #10b981;
}

.warning{
    background:#713f12;
    border:1px solid #f59e0b;
}

.danger{
    background:#7f1d1d;
    border:1px solid #ef4444;
}

.result h2{
    margin-top:0;
}

ul{
    line-height:2;
}

.note{
    margin:20px 0;
    color:#81958d;
    font-size:13px;
    text-align:center;
    line-height:1.7;
}

.footer{
    text-align:center;
    color:#536860;
    font-size:12px;
    margin-top:25px;
}

@media(max-width:500px){

    .banner{
        padding:35px 18px;
    }

    .banner h1{
        font-size:32px;
    }

    .banner p{
        font-size:17px;
    }

    .shield{
        font-size:45px;
    }

    .box{
        padding:18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <section class="banner">
        <div class="shield">🛡️</div>

        <h1>Link Checker</h1>

        <p>
            افحص الروابط واكتشف الروابط المشبوهة
        </p>

        <div class="line"></div>
    </section>


    <div class="box">

        <h2 class="title">
            🔍 محلل الروابط
        </h2>

        <div class="subtitle">
            أدخل الرابط للحصول على تحليل مبدئي
        </div>

        <input
            id="urlInput"
            type="text"
            placeholder="https://example.com"
        >

        <button onclick="analyzeURL()">
            🔍 تحليل الرابط
        </button>

        <div id="result" class="result"></div>

    </div>


    <div class="note">
        ⚠️ هذه الأداة تقدم تحليلًا مبدئيًا لبعض علامات الاشتباه،
        ولا تضمن أن الرابط آمن أو خطير.
    </div>

    <div class="footer">
        Link Checker © 2026
    </div>

</div>


<script>

function analyzeURL(){

    const input = document.getElementById("urlInput");
    const result = document.getElementById("result");

    let value = input.value.trim();

    if(!value){

        result.className = "result warning";
        result.style.display = "block";

        result.innerHTML = `
            <h2>⚠️ أدخل رابطًا أولًا</h2>
            <p>ضع الرابط في الخانة ثم اضغط تحليل الرابط.</p>
        `;

        return;
    }


    let testURL = value;

    if(!/^https?:\/\//i.test(testURL)){
        testURL = "https://" + testURL;
    }


    let url;

    try{

        url = new URL(testURL);

    }catch(e){

        result.className = "result danger";
        result.style.display = "block";

        result.innerHTML = `
            <h2>❌ الرابط غير صالح</h2>
            <p>تأكد من كتابة الرابط بطريقة صحيحة.</p>
        `;

        return;
    }


    let score = 0;
    let warnings = [];


    // HTTP غير مشفر
    if(url.protocol === "http:"){

        score += 2;

        warnings.push(
            "الرابط يستخدم HTTP بدل HTTPS"
        );
    }


    // الرمز @
    if(value.includes("@")){

        score += 2;

        warnings.push(
            "الرابط يحتوي على الرمز @"
        );
    }


    // Punycode
    if(url.hostname.includes("xn--")){

        score += 2;

        warnings.push(
            "اسم النطاق يستخدم Punycode"
        );
    }


    // شرطات كثيرة
    const hyphens =
        (url.hostname.match(/-/g) || []).length;

    if(hyphens >= 4){

        score += 1;

        warnings.push(
            "اسم النطاق يحتوي على عدد كبير من الشرطات"
        );
    }


    // أجزاء كثيرة في النطاق
    const parts =
        url.hostname.split(".").filter(Boolean);

    if(parts.length >= 5){

        score += 1;

        warnings.push(
            "اسم النطاق يحتوي على أجزاء كثيرة"
        );
    }


    // طول الرابط
    if(value.length > 120){

        score += 1;

        warnings.push(
            "الرابط طويل بشكل غير معتاد"
        );
    }


    // استخدام IP بدل اسم النطاق
    const ipPattern =
        /^(\d{1,3}\.){3}\d{1,3}$/;

    if(ipPattern.test(url.hostname)){

        score += 2;

        warnings.push(
            "الرابط يستخدم عنوان IP بدل اسم نطاق"
        );
    }


    let title;
    let message;
    let className;


    if(score >= 5){

        title = "🔴 درجة اشتباه مرتفعة";

        message =
            "تم اكتشاف عدة علامات قد تستحق الحذر.";

        className = "danger";

    }

    else if(score >= 2){

        title = "🟠 درجة اشتباه متوسطة";

        message =
            "تم اكتشاف بعض العلامات التي تستحق الانتباه.";

        className = "warning";

    }

    else{

        title = "🟢 درجة اشتباه منخفضة";

        message =
            "لم يتم اكتشاف علامات مريبة كثيرة في الرابط.";

        className = "safe";
    }


    let warningHTML = "";


    if(warnings.length > 0){

        warningHTML = `
            <h3>الأسباب:</h3>

            <ul>
                ${warnings
                    .map(w => `<li>${w}</li>`)
                    .join("")}
            </ul>
        `;

    }else{

        warningHTML =
            "<p>لم يتم اكتشاف علامات اشتباه واضحة.</p>";
    }


    result.className =
        "result " + className;

    result.style.display =
        "block";


    result.innerHTML = `
        <h2>${title}</h2>

        <p>${message}</p>

        <p>
            <b>درجة التحليل: ${score}</b>
        </p>

        ${warningHTML}
    `;
}

</script>

</body>
</html>
