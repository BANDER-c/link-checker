<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاحص الروابط</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#030807;
color:#fff;
}

.container{
max-width:850px;
margin:auto;
padding:18px;
}

.banner{
padding:45px 20px;
text-align:center;
border-radius:25px;
background:linear-gradient(135deg,#063d2b,#087a51,#16c784);
box-shadow:0 15px 45px rgba(0,0,0,.45);
border:1px solid #25d99a;
}

.shield{
font-size:55px;
}

.banner h1{
font-size:42px;
margin:10px 0;
}

.banner p{
color:#d9fff0;
font-size:18px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin:20px 0;
}

.stat{
background:#0b1712;
border:1px solid #214d3c;
border-radius:18px;
padding:20px 10px;
text-align:center;
}

.stat strong{
display:block;
font-size:30px;
color:#38e6a4;
}

.stat span{
color:#849991;
font-size:13px;
}

.card{
background:#0b1712;
border:1px solid #214d3c;
border-radius:22px;
padding:25px;
box-shadow:0 12px 35px rgba(0,0,0,.3);
}

.card h2{
text-align:center;
color:#45e9aa;
}

.sub{
text-align:center;
color:#849991;
margin-bottom:20px;
}

input{
width:100%;
padding:17px;
border-radius:12px;
border:1px solid #365e4d;
background:#030907;
color:#fff;
font-size:16px;
direction:ltr;
outline:none;
}

input:focus{
border-color:#20d991;
}

button{
width:100%;
margin-top:14px;
padding:17px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#18d889,#0cad6e);
color:#03130d;
font-size:17px;
font-weight:bold;
}

.result{
display:none;
margin-top:20px;
padding:20px;
border-radius:15px;
line-height:1.9;
}

.safe{
display:block;
background:#064e3b;
border:1px solid #10b981;
}

.warning{
display:block;
background:#713f12;
border:1px solid #f59e0b;
}

.danger{
display:block;
background:#7f1d1d;
border:1px solid #ef4444;
}

.note{
text-align:center;
color:#71857d;
font-size:13px;
line-height:1.8;
margin:20px 0;
}

@media(max-width:550px){
.stats{
grid-template-columns:1fr;
}

.banner h1{
font-size:34px;
}
}
</style>
</head>

<body>

<div class="container">

<section class="banner">
<div class="shield">🛡️</div>
<h1>LC</h1>
<p>افحص الروابط واكتشف العلامات المشبوهة</p>
</section>

<section class="stats">

<div class="stat">
<strong>🔍</strong>
<span>فحص سريع</span>
</div>

<div class="stat">
<strong>7+</strong>
<span>مؤشرات أمنية</span>
</div>

<div class="stat">
<strong>100%</strong>
<span>مجاني</span>
</div>

</section>

<section class="card">

<h2>🔎 تحليل الرابط</h2>

<div class="sub">
ضع الرابط هنا وسنحلله مبدئيًا
</div>

<input
id="urlInput"
type="text"
placeholder="https://example.com"
>

<button onclick="analyzeURL()">
🔍 فحص الرابط
</button>

<div id="result" class="result"></div>

</section>

<div class="note">
⚠️ الفحص يعتمد على مؤشرات موجودة في الرابط فقط، ولا يضمن أن الموقع آمن أو خطير.
</div>

</div>

<script>

function analyzeURL(){

const input=document.getElementById("urlInput");
const result=document.getElementById("result");

let value=input.value.trim();

if(!value){

result.className="result warning";
result.style.display="block";

result.innerHTML=
"<h2>⚠️ أدخل رابطًا أولًا</h2>"+
"<p>ضع الرابط في الخانة ثم اضغط فحص الرابط.</p>";

return;
}

let testURL=value;

if(!/^https?:\/\//i.test(testURL)){
testURL="https://"+testURL;
}

let url;

try{
url=new URL(testURL);
}catch(e){

result.className="result danger";
result.style.display="block";

result.innerHTML=
"<h2>❌ الرابط غير صالح</h2>"+
"<p>تأكد من كتابة الرابط بطريقة صحيحة.</p>";

return;
}

let score=0;
let warnings=[];

if(url.protocol==="http:"){
score+=2;
warnings.push("الرابط يستخدم HTTP بدل HTTPS");
}

if(value.includes("@")){
score+=2;
warnings.push("الرابط يحتوي على الرمز @");
}

if(url.hostname.includes("xn--")){
score+=2;
warnings.push("اسم النطاق يستخدم Punycode");
}

const hyphens=(url.hostname.match(/-/g)||[]).length;

if(hyphens>=4){
score++;
warnings.push("اسم النطاق يحتوي على عدد كبير من الشرطات");
}

const parts=url.hostname.split(".").filter(Boolean);

if(parts.length>=5){
score++;
warnings.push("اسم النطاق يحتوي على أجزاء كثيرة");
}

if(value.length>120){
score++;
warnings.push("الرابط طويل بشكل غير معتاد");
}

const ipPattern=/^(\d{1,3}\.){3}\d{1,3}$/;

if(ipPattern.test(url.hostname)){
score+=2;
warnings.push("الرابط يستخدم عنوان IP بدل اسم نطاق");
}

let type;
let title;
let message;

if(score>=5){

type="danger";
title="🔴 درجة اشتباه مرتفعة";
message="تم اكتشاف عدة علامات تستحق الحذر.";

}else if(score>=2){

type="warning";
title="🟠 درجة اشتباه متوسطة";
message="تم اكتشاف بعض العلامات التي تستحق الانتباه.";

}else{

type="safe";
title="🟢 درجة اشتباه منخفضة";
message="لم يتم اكتشاف علامات اشتباه واضحة.";

}

let warningHTML="";

if(warnings.length){

warningHTML="<h3>الأسباب:</h3><ul>";

warnings.forEach(function(w){
warningHTML+="<li>"+w+"</li>";
});

warningHTML+="</ul>";

}else{

warningHTML=
"<p>لم يتم اكتشاف علامات اشتباه واضحة.</p>";
}

result.className="result "+type;
result.style.display="block";

result.innerHTML=
"<h2>"+title+"</h2>"+
"<p>"+message+"</p>"+
"<p><b>درجة التحليل: "+score+"</b></p>"+
warningHTML;

}

</script>

</body>
</html>
