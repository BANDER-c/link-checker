<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاحص الروابط</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#030807;
color:#fff;
}

.container{
max-width:850px;
margin:auto;
padding:18px;
}

.banner{
padding:45px 20px;
text-align:center;
border-radius:25px;
background:linear-gradient(135deg,#063d2b,#087a51,#16c784);
box-shadow:0 15px 45px rgba(0,0,0,.45);
border:1px solid #25d99a;
}

.shield{
font-size:55px;
}

.banner h1{
font-size:42px;
margin:10px 0;
}

.banner p{
color:#d9fff0;
font-size:18px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin:20px 0;
}

.stat{
background:#0b1712;
border:1px solid #214d3c;
border-radius:18px;
padding:20px 10px;
text-align:center;
}

.stat strong{
display:block;
font-size:30px;
color:#38e6a4;
}

.stat span{
color:#849991;
font-size:13px;
}

.card{
background:#0b1712;
border:1px solid #214d3c;
border-radius:22px;
padding:25px;
box-shadow:0 12px 35px rgba(0,0,0,.3);
}

.card h2{
text-align:center;
color:#45e9aa;
}

.sub{
text-align:center;
color:#849991;
margin-bottom:20px;
}

input{
width:100%;
padding:17px;
border-radius:12px;
border:1px solid #365e4d;
background:#030907;
color:#fff;
font-size:16px;
direction:ltr;
outline:none;
}

input:focus{
border-color:#20d991;
}

button{
width:100%;
margin-top:14px;
padding:17px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#18d889,#0cad6e);
color:#03130d;
font-size:17px;
font-weight:bold;
}

.result{
display:none;
margin-top:20px;
padding:20px;
border-radius:15px;
line-height:1.9;
}

.safe{
display:block;
background:#064e3b;
border:1px solid #10b981;
}

.warning{
display:block;
background:#713f12;
border:1px solid #f59e0b;
}

.danger{
display:block;
background:#7f1d1d;
border:1px solid #ef4444;
}

.note{
text-align:center;
color:#71857d;
font-size:13px;
line-height:1.8;
margin:20px 0;
}

@media(max-width:550px){
.stats{
grid-template-columns:1fr;
}

.banner h1{
font-size:34px;
}
}
</style>
</head>

<body>

<div class="container">

<section class="banner">
<div class="shield">🛡️</div>
<h1>LC</h1>
<p>افحص الروابط واكتشف العلامات المشبوهة</p>
</section>

<section class="stats">

<div class="stat">
<strong>🔍</strong>
<span>فحص سريع</span>
</div>

<div class="stat">
<strong>7+</strong>
<span>مؤشرات أمنية</span>
</div>

<div class="stat">
<strong>100%</strong>
<span>مجاني</span>
</div>

</section>

<section class="card">

<h2>🔎 تحليل الرابط</h2>

<div class="sub">
ضع الرابط هنا وسنحلله مبدئيًا
</div>

<input
id="urlInput"
type="text"
placeholder="https://example.com"
>

<button onclick="analyzeURL()">
🔍 فحص الرابط
</button>

<div id="result" class="result"></div>

</section>

<div class="note">
⚠️ الفحص يعتمد على مؤشرات موجودة في الرابط فقط، ولا يضمن أن الموقع آمن أو خطير.
</div>

</div>

<script>


function analyzeRisk(url) {

  const reasons = [];
  let score = 0;

  let parsed;

  try {
    parsed = new URL(url);
  } catch {
    return {
      score: 100,
      reasons: ["الرابط غير صالح"]
    };
  }

  const hostname = parsed.hostname.toLowerCase();
  const fullUrl = url.toLowerCase();

  // استخدام HTTP غير المشفر
  if (parsed.protocol === "http:") {
    score += 5;
    reasons.push("الرابط يستخدم HTTP غير المشفر");
  }

  // استخدام IP بدل اسم نطاق
  if (/^\d{1,3}(\.\d{1,3}){3}$/.test(hostname)) {
    score += 20;
    reasons.push("يستخدم عنوان IP بدل اسم نطاق");
  }

  // Punycode
  if (hostname.includes("xn--")) {
    score += 20;
    reasons.push("النطاق يستخدم Punycode");
  }

  // الرمز @
  if (fullUrl.includes("@")) {
    score += 15;
    reasons.push("الرابط يحتوي على الرمز @");
  }

  // طول الرابط
  if (url.length > 120) {
    score += 10;
    reasons.push("الرابط طويل بشكل غير معتاد");
  }

  // كثرة النطاقات الفرعية
  const parts = hostname.split(".");
  if (parts.length >= 5) {
    score += 10;
    reasons.push("يحتوي على عدد كبير من النطاقات الفرعية");
  }

  // كلمات قد تظهر في صفحات التصيد
  const suspiciousWords = [
    "login",
    "verify",
    "verification",
    "secure",
    "account",
    "password",
    "signin",
    "update",
    "confirm"
  ];

  const foundWords = suspiciousWords.filter(word =>
    fullUrl.includes(word)
  );

  if (foundWords.length > 0) {
    score += Math.min(foundWords.length * 5, 15);

    reasons.push(
      "يحتوي على كلمات قد تُستخدم في صفحات التصيد: " +
      foundWords.join(", ")
    );
  }

  // أنماط شائعة لانتحال أسماء العلامات التجارية
  const impersonationPatterns = [
    "goog1e",
    "g00gle",
    "micros0ft",
    "micr0soft",
    "paypa1",
    "faceb00k",
    "app1e"
  ];

  const foundImpersonation = impersonationPatterns.find(pattern =>
    hostname.includes(pattern)
  );

  if (foundImpersonation) {
    score += 40;

    reasons.push(
      "النطاق يحتوي على نمط قد يشير إلى انتحال اسم علامة تجارية"
    );
  }

  // كثرة الشرطات
  const hyphens = (hostname.match(/-/g) || []).length;

  if (hyphens >= 4) {
    score += 10;
    reasons.push("النطاق يحتوي على عدد كبير من الشرطات");
  }

  return {
    score: Math.min(score, 100),
    reasons
  };
}


function getRiskLevel(score) {

  if (score >= 80) {
    return {
      text: "🔴 حرج",
      type: "danger"
    };
  }

  if (score >= 60) {
    return {
      text: "🟠 مرتفع",
      type: "danger"
    };
  }

  if (score >= 40) {
    return {
      text: "🟡 متوسط",
      type: "warning"
    };
  }

  return {
    text: "🟢 منخفض",
    type: "safe"
  };
}


async function analyzeURL(){

  const input = document.getElementById("urlInput");
  const result = document.getElementById("result");

  let value = input.value.trim();

  if(!value){
    result.className = "result warning";
    result.style.display = "block";
    result.innerHTML =
      "<h2>⚠️ أدخل رابطًا أولًا</h2>" +
      "<p>ضع الرابط في الخانة ثم اضغط فحص الرابط.</p>";
    return;
  }

  let testURL = value;

  if(!/^https?:\/\//i.test(testURL)){
    testURL = "https://" + testURL;
  }

  try{
    new URL(testURL);
  }catch(e){
    result.className = "result danger";
    result.style.display = "block";
    result.innerHTML =
      "<h2>❌ الرابط غير صالح</h2>" +
      "<p>تأكد من كتابة الرابط بطريقة صحيحة.</p>";
    return;
  }

  // رقم فحص جديد لمنع نتيجة فحص قديم من تغيير الشاشة
  const scanId = Date.now() + Math.random();
  window.LCScanId = scanId;

  // التحليل المحلي يظهر فورًا
  const localRisk = analyzeRisk(testURL);
  const localLevel = getRiskLevel(localRisk.score);

  const localReasons =
    localRisk.reasons.length
      ? localRisk.reasons
          .map(reason => "<li>" + reason + "</li>")
          .join("")
      : "<li>لا توجد مؤشرات محلية واضحة.</li>";

  result.className =
    "result " + localLevel.type;

  result.style.display = "block";

  result.innerHTML =
    "<h2>" +
    (localRisk.score >= 40
      ? "🟡 توجد مؤشرات تستحق الحذر"
      : "🟢 التحليل المحلي مكتمل") +
    "</h2>" +

    "<p>تم تحليل خصائص الرابط بسرعة، ويجري الآن فحص VirusTotal في الخلفية.</p>" +

    "<div style='font-size:32px;font-weight:bold;margin:15px 0'>" +
    localRisk.score +
    "/100" +
    "</div>" +

    "<p><b>مستوى الخطورة: " +
    localLevel.text +
    "</b></p>" +

    "<hr>" +

    "<h3>🔎 أسباب درجة الخطورة</h3>" +

    "<ul>" +
    localReasons +
    "</ul>" +

    "<p style='font-size:13px;opacity:.8'>" +
    "⏳ يتم تحديث النتيجة تلقائيًا عند وصول نتيجة VirusTotal." +
    "</p>";

  // فحص VirusTotal في الخلفية بدون تعطيل النتيجة المحلية
  (async function(){

    try{

      const controller = new AbortController();

      const timeout = setTimeout(() => {
        controller.abort();
      }, 20000);

      const response = await fetch(
        "https://lc-backend-7viz.onrender.com/scan",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url: testURL
          }),
          signal: controller.signal
        }
      );

      clearTimeout(timeout);

      const data = await response.json();

      if(!response.ok){
        throw new Error(
          data.error || "فشل إرسال الرابط للفحص"
        );
      }

      const analysisId =
        data.data && data.data.id;

      if(!analysisId){
        throw new Error("لم يتم الحصول على رقم التحليل");
      }

      let analysis = null;

      // الانتظار في الخلفية
      for(let i = 0; i < 12; i++){

        await new Promise(resolve =>
          setTimeout(resolve, 3000)
        );

        if(window.LCScanId !== scanId){
          return;
        }

        const check = await fetch(
          "https://lc-backend-7viz.onrender.com/scan/" +
          encodeURIComponent(analysisId)
        );

        const checkData = await check.json();

        if(!check.ok){
          throw new Error(
            checkData.error ||
            "تعذر الحصول على نتيجة التحليل"
          );
        }

        analysis = checkData.data;

        if(
          analysis &&
          analysis.attributes &&
          analysis.attributes.status === "completed"
        ){
          break;
        }
      }

      // إذا لم تكتمل VT، نترك النتيجة المحلية كما هي
      if(
        !analysis ||
        !analysis.attributes ||
        analysis.attributes.status !== "completed"
      ){
        return;
      }

      if(window.LCScanId !== scanId){
        return;
      }

      const stats =
        analysis.attributes.stats || {};

      const malicious =
        Number(stats.malicious || 0);

      const suspicious =
        Number(stats.suspicious || 0);

      const harmless =
        Number(stats.harmless || 0);

      const undetected =
        Number(stats.undetected || 0);

      const detections =
        malicious + suspicious;

      const total =
        malicious +
        suspicious +
        harmless +
        undetected;

      let vtScore = 0;
      const finalReasons = [...localRisk.reasons];

      if(malicious > 0){

        vtScore = 60;

        finalReasons.push(
          "VirusTotal اكتشف مؤشرات ضارة"
        );

      }else if(suspicious > 0){

        vtScore = 30;

        finalReasons.push(
          "VirusTotal اكتشف مؤشرات مشبوهة"
        );
      }

      const riskScore =
        Math.min(
          100,
          Math.max(localRisk.score, vtScore)
        );

      const level =
        getRiskLevel(riskScore);

      let title;
      let message;

      if(malicious > 0){

        title = "🔴 الرابط قد يكون خطيرًا";

        message =
          "اكتشفت محركات فحص مؤشرات ضارة في الرابط.";

      }else if(suspicious > 0){

        title = "🟠 الرابط مشبوه";

        message =
          "اكتشفت محركات فحص مؤشرات تستحق الحذر.";

      }else if(riskScore >= 40){

        title = "🟡 توجد مؤشرات تستحق الحذر";

        message =
          "تحليل خصائص الرابط أظهر بعض المؤشرات المشبوهة.";

      }else{

        title = "🟢 لم يتم اكتشاف تهديد";

        message =
          "لم تكتشف محركات الفحص المتاحة مؤشرات ضارة، ودرجة المؤشرات المحلية منخفضة.";

      }

      const reasonText =
        finalReasons.length
          ? finalReasons
              .map(reason => "<li>" + reason + "</li>")
              .join("")
          : "<li>لا توجد مؤشرات واضحة.</li>";

      result.className =
        "result " + level.type;

      result.innerHTML =
        "<h2>" + title + "</h2>" +
        "<p>" + message + "</p>" +

        "<div style='font-size:32px;font-weight:bold;margin:15px 0'>" +
        riskScore +
        "/100" +
        "</div>" +

        "<p><b>مستوى الخطورة: " +
        level.text +
        "</b></p>" +

        "<p><b>الاكتشافات: " +
        detections +
        " من " +
        total +
        "</b></p>" +

        "<p>ضار: " +
        malicious +
        " | مشبوه: " +
        suspicious +
        " | سليم: " +
        harmless +
        " | غير مكتشف: " +
        undetected +
        "</p>" +

        "<hr>" +

        "<h3>🔎 أسباب درجة الخطورة</h3>" +

        "<ul>" +
        reasonText +
        "</ul>" +

        "<p style='font-size:13px;opacity:.8'>" +
        "درجة الخطورة تقديرية وتعتمد على مؤشرات الرابط ونتائج VirusTotal، ولا تُعد حكمًا نهائيًا على أمان الرابط." +
        "</p>";

    }catch(error){

      // لا نحذف النتيجة المحلية إذا تأخر أو تعذر VirusTotal
      if(window.LCScanId !== scanId){
        return;
      }

      result.innerHTML +=
        "<p style='font-size:13px;opacity:.8'>" +
        "ℹ️ تعذر إكمال فحص VirusTotal حاليًا، لكن نتيجة التحليل المحلي ما زالت ظاهرة." +
        "</p>";
    }

  })();

}
</script>

</body>
</html>
